<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SynxEx</title>
    <link rel="stylesheet" href="/src/css/app.css">
    <style>
        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            background-color: var(--bg-primary);
            position: relative;
        }
        .right-panel {
            display: none;
            flex: 1;
            background: linear-gradient(135deg, #1A0A05 0%, #000000 100%);
            position: relative;
            overflow: hidden;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
        }
        @media (min-width: 1024px) {
            .right-panel {
                display: flex;
            }
        }
        .form-container {
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        /* Gradient blob */
        .right-panel::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255,85,36,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }
        .right-panel::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(140,20,20,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }
        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: none;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            margin-bottom: 1.25rem;
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.2rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-subtle);
            border-radius: 0.5rem;
            background-color: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .social-btn:hover {
            background-color: var(--bg-hover);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-subtle);
        }
        .divider:not(:empty)::before {
            margin-right: .5em;
        }
        .divider:not(:empty)::after {
            margin-left: .5em;
        }
        .decorative-text {
            position: relative;
            z-index: 10;
        }
        .decorative-text h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .decorative-text p {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.7);
            max-width: 400px;
        }
        .logo-large {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.5rem;
            position: relative;
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 2rem;
            text-decoration: none;
        }
        .lava-dot {
            width: 12px;
            height: 12px;
            background: #FF5524;
            border-radius: 50%;
        }
        .logo-large .lava-dot {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body class="theme-transition">
    <div class="split-layout">
        <div class="left-panel">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            
            <div class="form-container">
                <a href="/" class="logo">
                    <div class="lava-dot"></div>
                    SynxEx
                </a>
                
                <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">Welcome back</h1>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Please enter your details to sign in.</p>
                
                <form id="login-form">
                    <div class="input-group">
                        <label for="email" class="input-label" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-size: 0.875rem; font-weight: 500;">Email</label>
                        <input type="email" id="email" name="email" class="input" style="width: 100%; padding: 0.75rem; background-color: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 0.5rem; color: var(--text-primary);" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password" class="input-label" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-size: 0.875rem; font-weight: 500;">Password</label>
                        <input type="password" id="password" name="password" class="input" style="width: 100%; padding: 0.75rem; background-color: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 0.5rem; color: var(--text-primary);" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.875rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-primary); cursor: pointer;">
                            <input type="checkbox" style="accent-color: #FF5524;">
                            Remember me
                        </label>
                        <a href="#" style="color: #FF5524; text-decoration: none; font-weight: 500;">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-lava" style="width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #FF5524 0%, #CC3300 100%); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; margin-bottom: 1rem;">Sign in</button>
                    
                    <div class="divider">or</div>
                    
                    <button type="button" class="social-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Sign in with Google
                    </button>
                </form>
                
                <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.875rem;">
                    Don't have an account? <a href="register.html" style="color: #FF5524; text-decoration: none; font-weight: 500;">Sign up</a>
                </p>
                
                <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 3rem; color: var(--text-secondary); font-size: 0.75rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    End-to-end encrypted
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div class="logo-large">
                <div class="lava-dot"></div>
                SynxEx
            </div>
            <div class="decorative-text">
                <h1>The Borderless<br>Financial OS</h1>
                <p>Enterprise-grade infrastructure for the modern financial ecosystem. Secure, scalable, and beautifully designed.</p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/theme.js"></script>
    <script>
        // Init theme if module isn't loaded or fast enough
        function initTheme() {
            const savedTheme = localStorage.getItem('synxex-theme') || localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                updateThemeIcon('light');
            } else {
                document.documentElement.classList.add('dark');
                updateThemeIcon('dark');
            }
        }
        initTheme();

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('synxex-theme', 'light');
                updateThemeIcon('light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('synxex-theme', 'dark');
                updateThemeIcon('dark');
            }
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                if (theme === 'light') {
                    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
                } else {
                    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
                }
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }
    </script>
</body>
</html>
