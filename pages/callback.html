<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating — SynxEx</title>
    <link rel="stylesheet" href="/src/css/app.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #08080a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 85, 36, 0.2);
            border-top-color: #FF5524;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="spinner" style="margin: 0 auto 1.5rem;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem;">Connecting your SynxEx session</h2>
        <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">Completing single sign-on verification...</p>
    </div>

    <script type="module">
        import { authService } from '/src/js/auth.js';
        
        async function handleCallback() {
            try {
                await authService.init();
                const params = new URLSearchParams(window.location.search);
                const returnTo = params.get('returnTo') || '/';
                window.location.href = returnTo;
            } catch (err) {
                console.error('SSO Callback error:', err);
                window.location.href = '/pages/login.html?error=sso_failed';
            }
        }
        
        handleCallback();
    </script>
</body>
</html>
